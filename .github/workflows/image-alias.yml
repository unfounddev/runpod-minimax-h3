name: Add ComfyUI image alias without building
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy existing image and verify identical digest
        shell: bash
        run: |
          set -euo pipefail
          source=ghcr.io/unfounddev/runpod-minimax-h3:latest
          target=ghcr.io/unfounddev/comfyui-minimax-h3:latest
          digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "$target" "ghcr.io/unfounddev/runpod-minimax-h3@$digest"
          target_digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          test "$digest" = "$target_digest"
          printf 'Source: %s\nTarget: %s\nVerified identical digest: %s\n' "$source" "$target" "$digest" >> "$GITHUB_STEP_SUMMARY"
